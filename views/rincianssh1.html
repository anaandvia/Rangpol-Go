{{ define "rincianssh1" }}

<!-- views/rincianssh/index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Rincianssh</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
</head>
<body>
    <div class="container">
        <h2>Data Rincianssh</h2>
        <div class="table-responsive">
            <table class="table table-striped table-bordered" id="dataTable" width="100%" cellspacing="0" style="color: black;">
                <thead>
                    <tr>
                        <th>NO</th>
                        <th>NIM/NIDK/NIK</th>
                        <th>NAMA PEMINJAM</th>
                        <th>RinciansshID</th>
                        <th>Kode</th>
                        <th>Nama</th>
                        <th>Spesifikasi</th>
                        <th>Satuan</th>
                        <th>Harga</th>
                        <th>Tahun Anggaran</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>

    <script>
        $(document).ready(function() {
            $('#dataTable').DataTable({
                "processing": true,
                "serverSide": true,
                "ajax": {
                    "url": "/rincianssh/paginated",
                    "dataSrc": "data",
                    "data": function (d) {
                        d.page = (d.start / d.length) + 1;
                        d.pageSize = d.length;
                    }
                },
                "columns": [
                    { "data": "No" },
                    { "data": "SsrinciansshID" },
                    { "data": "RinciansshNama" },
                    { "data": "ID" },
                    { "data": "RinciansshKode" },
                    { "data": "RinciansshNama" },
                    { "data": "Spesifikasi" },
                    { "data": "Satuan" },
                    { "data": "Harga" },
                    { "data": "Thang" }
                ]
            });
        });
    </script>
</body>
</html>

{{ end }}
